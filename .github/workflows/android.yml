name: Android CI

on:
  # Local fork: allow starting a build by hand from the Actions tab or gh.
  workflow_dispatch:
  push:
    branches:
      - main
      - "release-branch/*"
  pull_request:
    # all PRs on all branches

jobs:
  build:
    runs-on: ubuntu-latest

    if: "!contains(github.event.head_commit.message, '[ci skip]')"

    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version-file: "go.mod"
      - name: Switch to Java 21
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: "temurin"
          java-version: "21"

      # Clean should essentially be a no-op, but make sure that it works.
      - name: Clean
        run: make clean

      # Local fork: a formatting nit should not stop us from producing an APK.
      - name: Format check (ktfmt)
        continue-on-error: true
        run: make fmt-check

      - name: Run Go tests
        run: make go-test

      - name: Build APKs
        run: make tailscale-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tailscale-debug-apk
          path: tailscale-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Run tests
        run: make test

      - name: Run release lint
        run: make release-lint
